<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Record Not Found (404) — History of Intervention</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/layout.css">
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column;">
  <header class="site-header">
    <div class="container">
      <div class="header-top">
        <div class="brand-wrapper">
          <a href="index.html" class="brand-title">History of Intervention</a>
          <span class="brand-subtitle">Historical Reference Archive</span>
        </div>
      </div>
    </div>
  </header>

  <main class="container container-narrow" style="margin-top: 4rem; text-align: center;">
    <div style="font-size: 3rem; margin-bottom: 1rem;">📜</div>
    <h1>404: Historical Document Not Found</h1>
    <p class="hero-lead">
      The specific archive URL or identifier you requested could not be located in the repository.
    </p>

    <div style="max-width: 500px; margin: 2rem auto;">
      <form action="search.html" method="get" style="display: flex; gap: 0.5rem;">
        <input type="search" name="q" placeholder="Search archive for event, leader, or company..." required>
        <button type="submit" class="btn btn-primary">Search</button>
      </form>
    </div>

    <div>
      <a href="index.html" class="btn">Return to Archive Home</a>
      <a href="timeline.html" class="btn">Browse Chronological Timeline</a>
    </div>
  </main>
</body>
</html>
